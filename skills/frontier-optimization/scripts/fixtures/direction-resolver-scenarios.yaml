route_investment_scenarios:
  - id: larger-sufficient-test-beats-cheap-underpowered-probe
    commitments:
      cheap-probe:
        route: bold-route
        maturity: screen
        cost_rank: 1
        sufficient: false
        failure: cannot-activate-mechanism
      integrated-observation:
        route: bold-route
        maturity: screen
        cost_rank: 3
        sufficient: true
        decision_change: continue-or-exclude-bold-route
    expected:
      ordered: [integrated-observation]
      selected: integrated-observation
      next_action: deepen
      existing_surface: Selection/B planning
  - id: admission-route-beats-incumbent-with-no-marginal-value
    commitments:
      breakthrough-screen:
        maturity: admission
        credible_mechanism: true
        material_upside: true
        sufficient: true
        final_performance_evidence: false
      mature-incumbent:
        maturity: scale
        sufficient: true
        marginal_value: false
        sunk_cost: high
    expected:
      ordered: [breakthrough-screen, mature-incumbent]
      selected: breakthrough-screen
      next_action: screen
      existing_surface: Selection/B planning
  - id: novelty-alone-does-not-win
    commitments:
      supported-route:
        maturity: validation
        credible_mechanism: true
        material_upside: true
        sufficient: true
      unsupported-novel-route:
        maturity: admission
        credible_mechanism: false
        material_upside: unknown
        sufficient: false
    expected:
      ordered: [supported-route]
      selected: supported-route
      next_action: deepen
      existing_surface: Selection/B planning
      preserved_routes:
        - {route: unsupported-novel-route, status: conditional, reopening_event: mechanism-and-sufficient-observation-found}
  - id: transition-maturity-maps-to-existing-owner
    commitments:
      reusable-result:
        maturity: transition
        sufficient: true
        destination_ready: true
    expected:
      ordered: [reusable-result]
      selected: reusable-result
      next_action: refer_parent
      existing_surface: parent owner
      owner: existing-professional-owner
      switch_map:
        - {observed_result: owner-rejects-transfer, next_action: defer, existing_surface: X}
  - id: parallel-screen-remains-one-selected-allocation
    commitments:
      parallel-screen-set:
        maturity: screen
        sufficient: true
        routes: [mechanism-a, mechanism-b]
        join_required: true
    expected:
      ordered: [parallel-screen-set]
      selected: parallel-screen-set
      next_action: screen
      existing_surface: Selection/B planning
